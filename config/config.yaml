paths:
  raw_data: "dataset/raw/email_data.csv"
  processed_data: "dataset/processed/email_data.csv"
  model: "artifacts/mail_classifier.joblib"
  metrics: "artifacts/metrics.json"
  confusion_matrix: "artifacts/confusion_matrix.png"
  error_analysis: "artifacts/error_analysis.csv"

data:
  text_column: "Message"
  label_column: "Category"

train:
  test_size: 0.2
  random_state: 42
  max_features: 10000
  alpha: [0.001, 0.01, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
